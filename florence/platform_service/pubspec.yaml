name: florence
description: Digital Health Platform for Chronic Disease Monitoring

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.2

  # Backend & API
  supabase_flutter: ^2.5.8
  http: ^1.2.1

  # Data Visualization
  fl_chart: ^1.1.1

  # Data Serialization
  json_annotation: ^4.8.1

  # Date & Time Handling
  intl: ^0.20.0
  table_calendar: ^3.2.0

  # Image Handling
  image_picker: ^1.1.2
  cached_network_image: ^3.3.1

  cupertino_icons: ^1.0.8
  app_links: ^6.4.1

  google_fonts:

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Code Generation
  build_runner: ^2.4.11
  json_serializable: ^6.8.0

  change_app_package_name: ^1.1.0

  flutter_app_name: ^0.1.1 

flutter:

  uses-material-design: true
  assets:
    - shorebird.yaml

flutter_app_name:
  name: "Florence"
