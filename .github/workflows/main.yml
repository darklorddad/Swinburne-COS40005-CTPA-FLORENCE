# The name of our workflow, visible on GitHub Actions tab
name: Deploy Flutter App

# --- TRIGGER DEFINITIONS ---
on:
  # 1. AUTOMATIC TRIGGER (for Patches)
  # Runs whenever code is pushed to the 'main' branch.
  push:
    branches:
      - main

  # 2. MANUAL TRIGGER (for Releases)
  # Adds a "Run workflow" button on the Actions tab in GitHub.
  workflow_dispatch:

jobs:
  build-and-deploy:
    # Use the latest version of Ubuntu to run our jobs
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the code from the repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Set up Shorebird
      - name: Setup Shorebird
        uses: shorebirdtech/setup-shorebird@v1

      # --- LOGIC FOR PATCHES ---
      # This step only runs if the trigger was an automatic 'push'.
      - name: Deploy a Patch (Automatic)
        if: github.event_name == 'push'
        working-directory: florence/platform_service
        run: shorebird patch android --no-confirm
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}

      # --- LOGIC FOR RELEASES ---
      # These steps only run if the trigger was a manual 'workflow_dispatch'.
      - name: Create a Full Release (Manual)
        if: github.event_name == 'workflow_dispatch'
        working-directory: florence/platform_service
        # Corrected command: 'release android --artifact apk' instead of 'build apk'
        # The '--force' flag is added to automatically proceed with the release.
        run: shorebird release android --no-confirm
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}

      - name: Upload to Firebase App Distribution (Manual)
        if: github.event_name == 'workflow_dispatch'
        # Updated method using Firebase CLI
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      - run: npm install -g firebase-tools
      - run: |
          firebase appdistribution:distribute florence/platform_service/build/app/outputs/apk/release/app-release.apk \
            --app "${{ secrets.FIREBASE_APP_ID }}" \
            --release-notes "Manual release from GitHub Actions" \
            --groups "testers" \
            --token "${{ secrets.FIREBASE_CLI_TOKEN }}"