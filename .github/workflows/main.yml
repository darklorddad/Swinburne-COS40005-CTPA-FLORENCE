name: Build and Distribute (Auto-Detect)

on:
  push:
    branches:
      - production
      - development
  workflow_dispatch:

jobs:
  build_and_distribute:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./florence/platform_service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required to compare versions

      # ----------------------------------------------------------------
      # INTELLIGENT DECISION MAKER
      # ----------------------------------------------------------------
      - name: Detect Release vs Patch
        id: decision
        run: |
          # 1. Get the current version from pubspec.yaml
          CURRENT_VERSION=$(grep '^version:' pubspec.yaml | sed 's/version:[ ]*//')
          
          # 2. Get the previous version from the last commit
          # Note: We use "|| echo" to handle the very first commit case gracefully
          PREV_VERSION=$(git show HEAD^:florence/platform_service/pubspec.yaml 2>/dev/null | grep '^version:' | sed 's/version:[ ]*//' || echo "0.0.0")

          echo "Previous: $PREV_VERSION"
          echo "Current:  $CURRENT_VERSION"

          # 3. Compare
          if [ "$CURRENT_VERSION" != "$PREV_VERSION" ]; then
            echo "is_release=true" >> $GITHUB_OUTPUT
            echo "Status: 🚀 Version Change Detected. Mode: FULL RELEASE (Firebase + Shorebird)"
          else
            echo "is_release=false" >> $GITHUB_OUTPUT
            echo "Status: 🩹 No Version Change. Mode: PATCH (Shorebird Only)"
          fi
          
          # 4. Check Branch (Prod vs Dev)
          if [[ "${{ github.ref }}" == "refs/heads/production" ]]; then
             echo "is_prod=true" >> $GITHUB_OUTPUT
          else
             echo "is_prod=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Setup Shorebird
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      # ==================================================================
      # PATH 1: FULL RELEASE
      # Triggered ONLY if you bumped the version number
      # ==================================================================
      - name: Shorebird Release (Build APK)
        if: steps.decision.outputs.is_release == 'true'
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        run: |
          shorebird release android --artifact=apk \
            --dart-define=DATA_SERVICE_URL=https://ds-florence-dhp.vercel.app \
            --dart-define=LLM_CHATBOT_SERVICE_URL=https://llmcs-florence-dhp.vercel.app

      - name: Upload to Firebase
        if: steps.decision.outputs.is_release == 'true'
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.CREDENTIAL_FILE_CONTENT }}
          groups: testers
          file: florence/platform_service/build/app/outputs/flutter-apk/app-release.apk
          releaseNotes: "New Release ${{ steps.decision.outputs.version }} - Requires Reinstall"

      # ==================================================================
      # PATH 2: PATCH (Production)
      # Triggered if version is SAME and branch is PRODUCTION
      # ==================================================================
      - name: Shorebird Patch (Live)
        if: steps.decision.outputs.is_release == 'false' && steps.decision.outputs.is_prod == 'true'
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        # Note: If you changed Native Code but forgot to bump version, 
        # this command will FAIL. This is your safety net.
        run: |
          shorebird patch android \
            --dart-define=DATA_SERVICE_URL=https://ds-florence-dhp.vercel.app \
            --dart-define=LLM_CHATBOT_SERVICE_URL=https://llmcs-florence-dhp.vercel.app

      # ==================================================================
      # PATH 3: PATCH (Staging/Dev)
      # Triggered if version is SAME and branch is NOT Production
      # ==================================================================
      - name: Shorebird Patch (Staging)
        if: steps.decision.outputs.is_release == 'false' && steps.decision.outputs.is_prod == 'false'
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        run: |
          shorebird patch android --staging \
            --dart-define=DATA_SERVICE_URL=https://ds-florence-dhp.vercel.app \
            --dart-define=LLM_CHATBOT_SERVICE_URL=https://llmcs-florence-dhp.vercel.app
