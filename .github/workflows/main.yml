# The name of our workflow, visible on GitHub Actions tab
name: Deploy Flutter App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # --- SETUP STEPS ---
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Shorebird
        uses: shorebirdtech/setup-shorebird@v1

      # --- PATCH LOGIC (RUNS ON PUSH) ---
      - name: Deploy a Patch (Automatic)
        if: github.event_name == 'push'
        working-directory: florence/platform_service
        run: shorebird patch android --no-confirm --release-version=latest
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}

      # --- RELEASE LOGIC (RUNS ON MANUAL TRIGGER) ---
      - name: Build a Full Release (Manual)
        if: github.event_name == 'workflow_dispatch'
        working-directory: florence/platform_service
        run: shorebird release android --no-confirm
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}

      # --- OFFICIAL GOOGLE FIREBASE DEPLOYMENT STEPS ---
      - name: Authenticate with Google Cloud
        if: github.event_name == 'workflow_dispatch'
        uses: google-github-actions/auth@v2
        with:
          # Use the original secret name
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON_BASE64 }}

      - name: Upload to Firebase App Distribution (Manual)
        if: github.event_name == 'workflow_dispatch'
        uses: google-github-actions/firebase-appdistribution-action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          groups: testers
          file: florence/platform_service/build/app/outputs/bundle/release/app-release.aab