name: Build and Distribute

on:
  push:
    branches:
      - production
  workflow_dispatch:

jobs:
  build_and_distribute:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./florence/platform_service

    steps:
      # 1. Download Code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Get Version from pubspec.yaml
      - name: Get Version from pubspec.yaml
        id: version
        run: echo "version=$(grep '^version:' pubspec.yaml | sed 's/version:[ ]*//')" >> $GITHUB_OUTPUT

      # 3. Setup Java
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 4. Setup Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      
      # 5. Install Dependencies
      - name: Install Dependencies
        run: flutter pub get

      # 6. Build APK
      - name: Build APK
        run: flutter build apk --release --build-name=${{ steps.version.outputs.version }} --build-number=${{ github.run_number }} --dart-define=DATA_SERVICE_URL=https://ds-florence-dhp.vercel.app --dart-define=LLM_CHATBOT_SERVICE_URL=https://llmcs-florence-dhp.vercel.app

      # 7. Upload to Firebase
      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.CREDENTIAL_FILE_CONTENT }}
          groups: testers
          file: florence/platform_service/build/app/outputs/flutter-apk/app-release.apk
          releaseNotes: "Version ${{ steps.version.outputs.version }} (Build ${{ github.run_number }}) - Automated Release"
