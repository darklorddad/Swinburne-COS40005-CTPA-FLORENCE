name: Build and Distribute

on:
  push:
    branches:
      - czy_testing_branch
  workflow_dispatch:

jobs:
  build_and_distribute:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./florence/platform_service

    steps:
      # 1. Download Code (Fetch depth 0 is required for version calculation)
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Calculate Semantic Version automatically
      - name: Calculate Semantic Version
        id: version
        uses: paulhatch/semantic-version@v5.4.0
        with:
          tag_prefix: "v"
          # If commit message contains "(MAJOR)", bump major version (1.0.0 -> 2.0.0)
          major_pattern: "(MAJOR)"
          # If commit message contains "(feat)", bump minor version (1.0.0 -> 1.1.0) 
          minor_pattern: "(feat)"
          version_format: "${major}.${minor}.${patch}"

      # 3. Setup Java
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 4. Setup Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      
      # 5. Install Dependencies
      - name: Install Dependencies
        run: flutter pub get

      # 6. Build APK
      # Injects the calculated version name (e.g., 1.2.0)
      - name: Build APK
        run: flutter build apk --debug --build-name=${{ steps.version.outputs.version }} --build-number=${{ github.run_number }}

      - name: Decode Firebase Service Account
        env:
          FIREBASE_SERVICE_ACCOUNT_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON_BASE64 }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT_BASE64" | base64 -d > firebase_credentials.json

      # 7. Upload to Firebase
      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFile: firebase_credentials.json
          groups: testers
          file: florence/platform_service/build/app/outputs/flutter-apk/app-debug.apk
          releaseNotes: "Version ${{ steps.version.outputs.version }} (Build ${{ github.run_number }}) - Automated Release"