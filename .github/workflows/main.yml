# The name of our workflow, visible on GitHub Actions tab
name: Deploy Flutter App

# This workflow runs on any push to the 'main' branch
on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    # Use the latest version of Ubuntu to run our jobs
    runs-on: ubuntu-latest
    steps:
      # Step 1: Check out the code from the repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Set up Shorebird (this also installs the correct Flutter version)
      - name: Setup Shorebird
        uses: shorebirdtech/setup-shorebird@v1

      # Step 3: Authenticate with Shorebird using our GitHub Secret
      - name: Authenticate Shorebird
        run: shorebird login --ci ${{ secrets.SHOREBIRD_TOKEN }}

      # Step 4: Decide whether to PATCH or RELEASE based on commit message
      - name: Deploy a Patch (Hot Restart Update)
        if: "!contains(github.event.head_commit.message, '[release]')"
        run: shorebird patch android --force

      # This step only runs if the commit message contains '[release]'
      - name: Build a Full Release
        if: "contains(github.event.head_commit.message, '[release]')"
        run: shorebird release android

      # Step 5: Upload to Firebase App Distribution (only if it was a release)
      - name: Upload to Firebase App Distribution
        if: "contains(github.event.head_commit.message, '[release]')"
        uses: wzieba/Firebase-Distribution-Action@v1 # <-- This line has been corrected
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          # Use the Base64 encoded JSON, not a token
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON_BASE64 }}
          groups: testers
          # Shorebird now outputs an .aab file for releases
          file: build/app/outputs/bundle/release/app-release.aab