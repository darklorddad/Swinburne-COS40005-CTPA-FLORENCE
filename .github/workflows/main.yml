# The name of our workflow, visible on GitHub Actions tab
name: Deploy Flutter App

# This workflow runs on any push to the 'main' branch
on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    # Use the latest version of Ubuntu to run our jobs
    runs-on: ubuntu-latest
    steps:
      # Step 1: Check out the code from the repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Set up Shorebird
      - name: Setup Shorebird
        uses: shorebirdtech/setup-shorebird@v1

      # Step 3: Deploy a Patch
      - name: Deploy a Patch
        if: "!contains(github.event.head_commit.message, '[release]')"
        # CORRECT: The working directory is your Flutter project's root folder
        working-directory: florence/platform_service
        run: shorebird patch android --no-confirm
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}

      # Step 4: Build a Full Release
      - name: Build a Full Release
        if: "contains(github.event.head_commit.message, '[release]')"
        # CORRECT: The working directory is your Flutter project's root folder
        working-directory: florence/platform_service
        run: shorebird release android --no-confirm
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}

      # Step 5: Upload to Firebase App Distribution
      - name: Upload to Firebase App Distribution
        if: "contains(github.event.head_commit.message, '[release]')"
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON_BASE64 }}
          groups: testers
          # CORRECT: The path to the build artifact, prefixed with the subdirectory
          file: florence/platform_service/build/app/outputs/bundle/release/app-release.aab