name: Manual Build and Distribute

on:
  push:
    branches:
      - czy_testing_branch
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Release Notes'
        required: false
        default: 'Manual build from GitHub'

jobs:
  build_and_distribute:
    runs-on: ubuntu-latest
    
    # This tells the runner to execute commands inside your flutter folder
    defaults:
      run:
        working-directory: ./florence/platform_service

    steps:
      # 1. Download Code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Java (Required for Android)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Setup Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      
      # 4. Install Dependencies
      - name: Install Dependencies
        run: flutter pub get

      # 5. Build APK (Debug version)
      - name: Build APK
        run: flutter build apk --debug

      # 6. Upload to Firebase
      # Note: We don't use working-directory here because this action looks from root
      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          token: ${{ secrets.FIREBASE_TOKEN }}
          groups: testers
          file: florence/platform_service/build/app/outputs/flutter-apk/app-debug.apk
          releaseNotes: ${{ inputs.release_notes || 'Automatic build from commit' }}