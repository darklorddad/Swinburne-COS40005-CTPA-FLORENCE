<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <style>
      .input-box { fill: #dbeafe; stroke: #3b82f6; stroke-width: 2; }
      .ai-box { fill: #f3e8ff; stroke: #7c3aed; stroke-width: 2; }
      .tool-box { fill: #fef3c7; stroke: #f59e0b; stroke-width: 2; }
      .output-box { fill: #d1fae5; stroke: #10b981; stroke-width: 2; }
      .text { font-family: 'Inter', Arial, sans-serif; font-size: 12px; fill: #1e293b; text-anchor: middle; }
      .title { font-family: 'Inter', Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-size: 10px; fill: #64748b; }
      .header { font-size: 14px; font-weight: 600; }
      .emoji { font-size: 22px; }
      .arrow { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrowhead); }
      .tool-arrow { fill: none; stroke: #f59e0b; stroke-width: 2; marker-end: url(#arrowhead-orange); stroke-dasharray: 5,5; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#64748b" />
    </marker>
    <marker id="arrowhead-orange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#f59e0b" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" class="title" style="font-size: 20px;">AI Agent Workflow: LangChain Tool-Calling</text>

  <!-- Step 1: Patient Query -->
  <g>
    <rect x="50" y="70" width="140" height="80" rx="10" class="input-box" />
    <text x="120" y="95" class="emoji">💬</text>
    <text x="120" y="120" class="header">Patient Query</text>
    <text x="120" y="138" class="subtitle">"Why is my glucose high</text>
    <text x="120" y="150" class="subtitle">this morning?"</text>
  </g>

  <!-- Arrow to AI Agent -->
  <path d="M 190 110 L 240 110" class="arrow" />

  <!-- Step 2: AI Agent (Core) -->
  <g>
    <rect x="240" y="60" width="180" height="220" rx="10" class="ai-box" />
    <text x="330" y="90" class="emoji" style="font-size: 28px;">🤖</text>
    <text x="330" y="120" class="header" style="font-size: 16px;">LangChain AI Agent</text>
    <text x="330" y="140" class="subtitle">(GPT-4 with Tool-Calling)</text>

    <!-- Agent Process -->
    <rect x="255" y="155" width="150" height="110" rx="8" style="fill: white; stroke: #a78bfa; stroke-width: 1.5;" />
    <text x="330" y="175" class="text" style="font-weight: 600; font-size: 11px;">Agent Reasoning:</text>
    <text x="330" y="193" class="subtitle">1. Parse patient question</text>
    <text x="330" y="208" class="subtitle">2. Identify data needed</text>
    <text x="330" y="223" class="subtitle">3. Call appropriate tools</text>
    <text x="330" y="238" class="subtitle">4. Analyze retrieved data</text>
    <text x="330" y="253" class="subtitle">5. Generate response</text>
  </g>

  <!-- Tools Section -->
  <g>
    <text x="600" y="60" class="header" style="fill: #92400e;">🔧 Available Tools</text>

    <!-- Tool 1: Get Glucose Data -->
    <rect x="480" y="80" width="220" height="50" rx="8" class="tool-box" />
    <text x="590" y="100" class="text" style="font-weight: 600;">get_glucose_readings()</text>
    <text x="590" y="118" class="subtitle">Fetch recent glucose measurements</text>

    <!-- Tool 2: Get Diet History -->
    <rect x="480" y="140" width="220" height="50" rx="8" class="tool-box" />
    <text x="590" y="160" class="text" style="font-weight: 600;">get_diet_history()</text>
    <text x="590" y="178" class="subtitle">Retrieve meal logs and nutrition</text>

    <!-- Tool 3: Get Activity Data -->
    <rect x="480" y="200" width="220" height="50" rx="8" class="tool-box" />
    <text x="590" y="220" class="text" style="font-weight: 600;">get_activity_data()</text>
    <text x="590" y="238" class="subtitle">Fetch exercise and movement logs</text>

    <!-- Tool 4: Get Medication -->
    <rect x="480" y="260" width="220" height="50" rx="8" class="tool-box" />
    <text x="590" y="280" class="text" style="font-weight: 600;">get_medication_log()</text>
    <text x="590" y="298" class="subtitle">Check medication adherence</text>
  </g>

  <!-- Tool Calling Arrows -->
  <path d="M 420 170 L 480 105" class="tool-arrow" />
  <path d="M 420 190 L 480 165" class="tool-arrow" />
  <path d="M 420 210 L 480 225" class="tool-arrow" />
  <path d="M 420 230 L 480 285" class="tool-arrow" />

  <text x="450" y="200" class="subtitle" style="fill: #92400e; font-weight: 600;">Autonomous</text>
  <text x="450" y="213" class="subtitle" style="fill: #92400e; font-weight: 600;">tool calls</text>

  <!-- Data Service Connection -->
  <g>
    <rect x="480" y="330" width="220" height="60" rx="8" style="fill: #dcfce7; stroke: #16a34a; stroke-width: 2;" />
    <text x="590" y="355" class="header" style="fill: #065f46;">Data Service API</text>
    <text x="590" y="375" class="subtitle">Secure gateway to Supabase</text>
  </g>

  <!-- Arrows from Tools to Data Service -->
  <path d="M 590 130 L 590 330" style="fill: none; stroke: #10b981; stroke-width: 2; stroke-dasharray: 3,3;" />

  <!-- Arrow from Agent to Response -->
  <path d="M 240 170 L 190 220" class="arrow" />

  <!-- Step 3: Personalized Response -->
  <g>
    <rect x="50" y="200" width="140" height="110" rx="10" class="output-box" />
    <text x="120" y="225" class="emoji">💡</text>
    <text x="120" y="250" class="header">AI Response</text>
    <text x="120" y="268" class="subtitle">"Your glucose is high because</text>
    <text x="120" y="281" class="subtitle">you had a high-carb dinner</text>
    <text x="120" y="294" class="subtitle">last night and missed your</text>
    <text x="120" y="307" class="subtitle">evening walk..."</text>
  </g>

  <!-- Context Box -->
  <g>
    <rect x="50" y="330" width="370" height="90" rx="10" style="fill: #eff6ff; stroke: #3b82f6; stroke-width: 2; stroke-dasharray: 5,5;" />
    <text x="235" y="355" class="text" style="font-weight: 700; font-size: 14px; fill: #1e40af;">Key AI Innovation</text>
    <text x="235" y="375" class="subtitle">✓ <tspan font-weight="600">Context-aware:</tspan> AI analyzes patient's complete health timeline</text>
    <text x="235" y="393" class="subtitle">✓ <tspan font-weight="600">Autonomous:</tspan> Agent decides which data to fetch automatically</text>
    <text x="235" y="411" class="subtitle">✓ <tspan font-weight="600">Personalized:</tspan> Insights tailored to individual patterns and behaviors</text>
  </g>
</svg>