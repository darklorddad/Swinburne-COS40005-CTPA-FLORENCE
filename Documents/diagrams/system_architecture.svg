<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <!-- System Architecture Diagram -->
  <defs>
    <style>
      .box { fill: #fff; stroke: #2563eb; stroke-width: 2; }
      .patient-box { fill: #dbeafe; stroke: #1e40af; stroke-width: 2; }
      .service-box { fill: #dcfce7; stroke: #16a34a; stroke-width: 2; }
      .db-box { fill: #fef3c7; stroke: #d97706; stroke-width: 2; }
      .ai-box { fill: #f3e8ff; stroke: #7c3aed; stroke-width: 2; }
      .text { font-family: 'Inter', Arial, sans-serif; font-size: 14px; fill: #1e293b; }
      .title { font-family: 'Inter', Arial, sans-serif; font-size: 16px; font-weight: 700; fill: #0f172a; }
      .small { font-size: 11px; fill: #475569; }
      .arrow { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrowhead); }
      .data-arrow { fill: none; stroke: #10b981; stroke-width: 2; marker-end: url(#arrowhead-green); stroke-dasharray: 5,5; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#64748b" />
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#10b981" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="25" text-anchor="middle" class="title" style="font-size: 20px;">System Architecture</text>

  <!-- Patient/User Layer -->
  <rect x="50" y="50" width="700" height="80" rx="10" class="patient-box" />
  <text x="400" y="75" text-anchor="middle" class="title">Patient Interface</text>

  <!-- Mobile App -->
  <rect x="120" y="90" width="140" height="30" rx="5" style="fill: #3b82f6; stroke: none;" />
  <text x="190" y="110" text-anchor="middle" class="text" style="fill: white; font-weight: 600;">📱 Mobile App</text>

  <!-- Web App -->
  <rect x="300" y="90" width="140" height="30" rx="5" style="fill: #3b82f6; stroke: none;" />
  <text x="370" y="110" text-anchor="middle" class="text" style="fill: white; font-weight: 600;">💻 Web App</text>

  <!-- Clinician Dashboard -->
  <rect x="480" y="90" width="170" height="30" rx="5" style="fill: #8b5cf6; stroke: none;" />
  <text x="565" y="110" text-anchor="middle" class="text" style="fill: white; font-weight: 600;">👨‍⚕️ Clinician Dashboard</text>

  <!-- Platform Service (Flutter) -->
  <rect x="250" y="160" width="300" height="70" rx="10" class="box" />
  <text x="400" y="185" text-anchor="middle" class="title">Platform Service</text>
  <text x="400" y="205" text-anchor="middle" class="small">Flutter Frontend Framework</text>
  <text x="400" y="220" text-anchor="middle" class="small" style="font-style: italic;">Single Codebase → Multi-platform UI</text>

  <!-- Arrows from Patient to Platform -->
  <path d="M 190 130 L 190 160" class="arrow" />
  <path d="M 370 130 L 370 160" class="arrow" />
  <path d="M 565 130 L 565 160" class="arrow" />

  <!-- Service Layer -->
  <g>
    <!-- Data Service -->
    <rect x="60" y="270" width="220" height="100" rx="10" class="service-box" />
    <text x="170" y="295" text-anchor="middle" class="title">Data Service</text>
    <text x="170" y="315" text-anchor="middle" class="small">Python + FastAPI</text>
    <text x="170" y="335" text-anchor="middle" class="small">🔐 Authentication Gateway</text>
    <text x="170" y="350" text-anchor="middle" class="small">📊 Data Operations</text>
    <text x="170" y="365" text-anchor="middle" class="small">🛡️ Security Layer</text>

    <!-- LLM Chatbot Service -->
    <rect x="520" y="270" width="220" height="100" rx="10" class="ai-box" />
    <text x="630" y="295" text-anchor="middle" class="title">LLM Chatbot Service</text>
    <text x="630" y="315" text-anchor="middle" class="small">Python + LangChain</text>
    <text x="630" y="335" text-anchor="middle" class="small">🤖 AI Agent (GPT-4)</text>
    <text x="630" y="350" text-anchor="middle" class="small">🔧 Tool-Calling Functions</text>
    <text x="630" y="365" text-anchor="middle" class="small">💬 Context Management</text>
  </g>

  <!-- Arrows from Platform to Services -->
  <path d="M 300 230 L 220 270" class="arrow" />
  <path d="M 500 230 L 580 270" class="arrow" />

  <!-- Bidirectional arrow between services -->
  <path d="M 280 320 L 520 320" class="data-arrow" />
  <text x="400" y="315" text-anchor="middle" class="small" style="fill: #16a34a; font-weight: 600;">Data Exchange</text>

  <!-- Database Layer -->
  <rect x="150" y="420" width="500" height="100" rx="10" class="db-box" />
  <text x="400" y="445" text-anchor="middle" class="title">Supabase Backend (BaaS)</text>
  <text x="400" y="465" text-anchor="middle" class="small">PostgreSQL Database + Authentication + Storage</text>

  <g transform="translate(200, 475)">
    <rect x="0" y="0" width="120" height="35" rx="5" style="fill: white; stroke: #d97706; stroke-width: 1;" />
    <text x="60" y="22" text-anchor="middle" class="small">🗄️ Patient Data</text>
  </g>

  <g transform="translate(340, 475)">
    <rect x="0" y="0" width="120" height="35" rx="5" style="fill: white; stroke: #d97706; stroke-width: 1;" />
    <text x="60" y="22" text-anchor="middle" class="small">📈 Health Metrics</text>
  </g>

  <g transform="translate(480, 475)">
    <rect x="0" y="0" width="120" height="35" rx="5" style="fill: white; stroke: #d97706; stroke-width: 1;" />
    <text x="60" y="22" text-anchor="middle" class="small">🔒 RLS Security</text>
  </g>

  <!-- Arrows from Services to Database -->
  <path d="M 170 370 L 250 420" class="arrow" />
  <path d="M 630 370 L 550 420" class="arrow" />

  <!-- External Data Sources -->
  <g>
    <text x="400" y="555" text-anchor="middle" class="small" style="font-weight: 600;">External Data Integration</text>
    <text x="200" y="575" text-anchor="middle" class="small">📊 Glucose Meters</text>
    <text x="350" y="575" text-anchor="middle" class="small">🍎 Diet Tracking</text>
    <text x="500" y="575" text-anchor="middle" class="small">🏃 Activity Monitors</text>
    <text x="650" y="575" text-anchor="middle" class="small">💊 Medication Logs</text>
  </g>
</svg>