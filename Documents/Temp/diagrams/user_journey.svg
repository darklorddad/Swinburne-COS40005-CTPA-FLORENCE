<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500">
  <defs>
    <style>
      .step-box { fill: #fff; stroke: #3b82f6; stroke-width: 2; }
      .ai-box { fill: #f3e8ff; stroke: #7c3aed; stroke-width: 2; }
      .alert-box { fill: #fee2e2; stroke: #dc2626; stroke-width: 2; }
      .success-box { fill: #d1fae5; stroke: #10b981; stroke-width: 2; }
      .text { font-family: 'Inter', Arial, sans-serif; font-size: 13px; fill: #1e293b; text-anchor: middle; }
      .title { font-family: 'Inter', Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-size: 11px; fill: #64748b; }
      .arrow { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrowhead); }
      .alert-arrow { fill: none; stroke: #dc2626; stroke-width: 2.5; marker-end: url(#arrowhead-red); }
      .emoji { font-size: 28px; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#64748b" />
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#dc2626" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" class="title" style="font-size: 22px;">Patient Journey: From Data to Action</text>

  <!-- Step 1: Patient Input -->
  <g>
    <rect x="50" y="70" width="150" height="120" rx="10" class="step-box" />
    <text x="125" y="100" class="emoji">📱</text>
    <text x="125" y="130" class="text" style="font-weight: 600;">1. Patient Input</text>
    <text x="125" y="150" class="subtitle">Logs glucose reading</text>
    <text x="125" y="165" class="subtitle">Records meals</text>
    <text x="125" y="180" class="subtitle">Tracks activity</text>
  </g>

  <!-- Arrow 1 to 2 -->
  <path d="M 200 130 L 250 130" class="arrow" />
  <text x="225" y="125" class="subtitle" style="fill: #3b82f6; font-weight: 600;">Real-time</text>

  <!-- Step 2: Data Integration -->
  <g>
    <rect x="250" y="70" width="150" height="120" rx="10" class="step-box" />
    <text x="325" y="100" class="emoji">🔄</text>
    <text x="325" y="130" class="text" style="font-weight: 600;">2. Data Integration</text>
    <text x="325" y="150" class="subtitle">Multi-source data</text>
    <text x="325" y="165" class="subtitle">Secure storage</text>
    <text x="325" y="180" class="subtitle">Data validation</text>
  </g>

  <!-- Arrow 2 to 3 -->
  <path d="M 400 130 L 450 130" class="arrow" />

  <!-- Step 3: AI Analysis -->
  <g>
    <rect x="450" y="70" width="150" height="120" rx="10" class="ai-box" />
    <text x="525" y="100" class="emoji">🤖</text>
    <text x="525" y="130" class="text" style="font-weight: 600;">3. AI Analysis</text>
    <text x="525" y="150" class="subtitle">Pattern detection</text>
    <text x="525" y="165" class="subtitle">Context awareness</text>
    <text x="525" y="180" class="subtitle">Risk assessment</text>
  </g>

  <!-- Arrow 3 to 4 -->
  <path d="M 600 130 L 650 130" class="arrow" />

  <!-- Step 4: Personalized Insights -->
  <g>
    <rect x="650" y="70" width="150" height="120" rx="10" class="success-box" />
    <text x="725" y="100" class="emoji">💡</text>
    <text x="725" y="130" class="text" style="font-weight: 600;">4. Insights</text>
    <text x="725" y="150" class="subtitle">Actionable advice</text>
    <text x="725" y="165" class="subtitle">Trend visualization</text>
    <text x="725" y="180" class="subtitle">Goal tracking</text>
  </g>

  <!-- Decision Diamond -->
  <g>
    <path d="M 525 210 L 575 260 L 525 310 L 475 260 Z" style="fill: #fef3c7; stroke: #d97706; stroke-width: 2;" />
    <text x="525" y="255" class="text" style="font-size: 11px;">High Risk</text>
    <text x="525" y="270" class="text" style="font-size: 11px;">Detected?</text>
  </g>

  <!-- Arrow from AI to Decision -->
  <path d="M 525 190 L 525 210" class="arrow" />

  <!-- NO Path - Patient Self-Management -->
  <g>
    <path d="M 575 260 L 650 260" class="arrow" />
    <text x="612" y="255" class="subtitle" style="fill: #10b981; font-weight: 600;">NO</text>

    <rect x="650" y="230" width="180" height="60" rx="10" class="success-box" />
    <text x="740" y="255" class="text" style="font-weight: 600;">✅ Patient Self-Care</text>
    <text x="740" y="275" class="subtitle">Continues normal routine</text>
  </g>

  <!-- YES Path - Alert Clinician -->
  <g>
    <path d="M 475 260 L 350 260" class="alert-arrow" />
    <text x="412" y="255" class="subtitle" style="fill: #dc2626; font-weight: 600;">YES</text>

    <rect x="170" y="230" width="180" height="60" rx="10" class="alert-box" />
    <text x="260" y="255" class="text" style="font-weight: 600;">⚠️ Alert Clinician</text>
    <text x="260" y="275" class="subtitle">Priority notification</text>
  </g>

  <!-- Step 5: Clinician Review -->
  <g>
    <rect x="50" y="320" width="150" height="100" rx="10" style="fill: #ede9fe; stroke: #7c3aed; stroke-width: 2;" />
    <text x="125" y="350" class="emoji">👨‍⚕️</text>
    <text x="125" y="380" class="text" style="font-weight: 600;">5. Clinician Review</text>
    <text x="125" y="400" class="subtitle">Risk prioritization</text>
    <text x="125" y="415" class="subtitle">Intervention decision</text>
  </g>

  <!-- Arrow from Alert to Clinician Review -->
  <path d="M 260 290 L 125 320" class="alert-arrow" />

  <!-- Step 6: Intervention -->
  <g>
    <rect x="250" y="320" width="150" height="100" rx="10" class="success-box" />
    <text x="325" y="350" class="emoji">🏥</text>
    <text x="325" y="380" class="text" style="font-weight: 600;">6. Intervention</text>
    <text x="325" y="400" class="subtitle">Timely care</text>
    <text x="325" y="415" class="subtitle">Improved outcomes</text>
  </g>

  <!-- Arrow from Clinician to Intervention -->
  <path d="M 200 370 L 250 370" class="arrow" />

  <!-- Continuous Monitoring Loop -->
  <g>
    <path d="M 740 190 Q 850 130 850 370 Q 850 450 400 470 Q 125 470 125 430"
          style="fill: none; stroke: #3b82f6; stroke-width: 2; stroke-dasharray: 5,5; marker-end: url(#arrowhead);" />
    <text x="850" y="260" class="subtitle" style="fill: #3b82f6; font-weight: 600; text-anchor: start;">Continuous</text>
    <text x="850" y="275" class="subtitle" style="fill: #3b82f6; font-weight: 600; text-anchor: start;">Monitoring</text>
  </g>

  <!-- Key Benefit Callout -->
  <g>
    <rect x="450" y="350" width="350" height="120" rx="10" style="fill: #f0f9ff; stroke: #0284c7; stroke-width: 2; stroke-dasharray: 5,5;" />
    <text x="625" y="375" class="text" style="font-size: 15px; font-weight: 700; fill: #0c4a6e;">Key Innovation</text>
    <text x="625" y="395" class="text" style="font-size: 12px; fill: #075985;">🎯 Proactive vs. Reactive Care</text>
    <text x="625" y="415" class="subtitle" style="text-anchor: middle;">AI identifies risks <tspan font-weight="600">before</tspan> they become emergencies</text>
    <text x="625" y="435" class="subtitle" style="text-anchor: middle;">Clinicians focus on high-risk patients (attention funnel)</text>
    <text x="625" y="455" class="subtitle" style="text-anchor: middle;">Patients empowered with real-time, personalized guidance</text>
  </g>
</svg>