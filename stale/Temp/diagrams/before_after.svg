<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550">
  <defs>
    <style>
      .problem-box { fill: #fee2e2; stroke: #dc2626; stroke-width: 2; }
      .solution-box { fill: #d1fae5; stroke: #10b981; stroke-width: 2; }
      .fragment-box { fill: #fef2f2; stroke: #f87171; stroke-width: 1.5; stroke-dasharray: 5,5; }
      .integrated-box { fill: #ecfdf5; stroke: #34d399; stroke-width: 2; }
      .text { font-family: 'Inter', Arial, sans-serif; font-size: 12px; fill: #1e293b; text-anchor: middle; }
      .title { font-family: 'Inter', Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-size: 11px; fill: #64748b; }
      .header { font-size: 16px; font-weight: 600; }
      .emoji { font-size: 24px; }
      .broken-line { fill: none; stroke: #ef4444; stroke-width: 2; stroke-dasharray: 10,5; opacity: 0.5; }
      .flow-line { fill: none; stroke: #10b981; stroke-width: 2.5; marker-end: url(#arrowhead-green); }
    </style>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#10b981" />
    </marker>
  </defs>

  <!-- Main Title -->
  <text x="450" y="30" text-anchor="middle" class="title" style="font-size: 22px;">The Problem We're Solving</text>

  <!-- Divider Line -->
  <line x1="450" y1="50" x2="450" y2="530" stroke="#cbd5e1" stroke-width="3" />

  <!-- BEFORE Section -->
  <g>
    <rect x="20" y="60" width="410" height="50" rx="10" class="problem-box" />
    <text x="225" y="90" class="header" style="fill: #991b1b;">❌ BEFORE: Fragmented Care</text>

    <!-- Patient in center -->
    <circle cx="225" cy="200" r="35" fill="#fecaca" stroke="#dc2626" stroke-width="2" />
    <text x="225" y="195" class="emoji">😰</text>
    <text x="225" y="220" class="text" style="font-weight: 600;">Patient</text>

    <!-- Fragmented data sources around patient -->
    <!-- Top Left -->
    <g>
      <rect x="50" y="140" width="90" height="60" rx="5" class="fragment-box" />
      <text x="95" y="160" class="emoji" style="font-size: 20px;">📊</text>
      <text x="95" y="185" class="subtitle">Glucose Data</text>
      <text x="95" y="198" class="subtitle" style="font-size: 9px;">(Isolated)</text>
      <path d="M 140 170 L 190 180" class="broken-line" />
    </g>

    <!-- Top Right -->
    <g>
      <rect x="310" y="140" width="90" height="60" rx="5" class="fragment-box" />
      <text x="355" y="160" class="emoji" style="font-size: 20px;">🍎</text>
      <text x="355" y="185" class="subtitle">Diet Logs</text>
      <text x="355" y="198" class="subtitle" style="font-size: 9px;">(Separate app)</text>
      <path d="M 310 170 L 260 180" class="broken-line" />
    </g>

    <!-- Left -->
    <g>
      <rect x="30" y="230" width="90" height="60" rx="5" class="fragment-box" />
      <text x="75" y="250" class="emoji" style="font-size: 20px;">🏃</text>
      <text x="75" y="275" class="subtitle">Activity</text>
      <text x="75" y="288" class="subtitle" style="font-size: 9px;">(Different device)</text>
      <path d="M 120 260 L 190 210" class="broken-line" />
    </g>

    <!-- Right -->
    <g>
      <rect x="330" y="230" width="90" height="60" rx="5" class="fragment-box" />
      <text x="375" y="250" class="emoji" style="font-size: 20px;">📋</text>
      <text x="375" y="275" class="subtitle">Medical Records</text>
      <text x="375" y="288" class="subtitle" style="font-size: 9px;">(Doctor's office)</text>
      <path d="M 330 260 L 260 210" class="broken-line" />
    </g>

    <!-- Bottom Left -->
    <g>
      <rect x="70" y="310" width="90" height="60" rx="5" class="fragment-box" />
      <text x="115" y="330" class="emoji" style="font-size: 20px;">💊</text>
      <text x="115" y="355" class="subtitle">Medications</text>
      <text x="115" y="368" class="subtitle" style="font-size: 9px;">(Paper notes)</text>
      <path d="M 160 320 L 200 220" class="broken-line" />
    </g>

    <!-- Bottom Right -->
    <g>
      <rect x="290" y="310" width="90" height="60" rx="5" class="fragment-box" />
      <text x="335" y="330" class="emoji" style="font-size: 20px;">🩺</text>
      <text x="335" y="355" class="subtitle">Symptoms</text>
      <text x="335" y="368" class="subtitle" style="font-size: 9px;">(Memory only)</text>
      <path d="M 290 320 L 250 220" class="broken-line" />
    </g>

    <!-- Problem Icons -->
    <g transform="translate(20, 390)">
      <rect x="0" y="0" width="410" height="130" rx="8" style="fill: #fef2f2; stroke: #fca5a5; stroke-width: 1.5;" />
      <text x="205" y="25" class="text" style="font-weight: 700; fill: #991b1b;">Patient & Clinician Challenges:</text>

      <text x="30" y="50" class="subtitle" style="text-anchor: start;">😓 Patient overwhelmed with fragmented information</text>
      <text x="30" y="68" class="subtitle" style="text-anchor: start;">📉 Low health literacy, difficulty self-managing</text>
      <text x="30" y="86" class="subtitle" style="text-anchor: start;">⏰ Delayed care - reactive approach only</text>
      <text x="30" y="104" class="subtitle" style="text-anchor: start;">👨‍⚕️ Clinician lacks integrated view for decisions</text>
      <text x="30" y="122" class="subtitle" style="text-anchor: start;">🏥 System overload: High patient-to-doctor ratios [1]</text>
    </g>
  </g>

  <!-- AFTER Section -->
  <g>
    <rect x="470" y="60" width="410" height="50" rx="10" class="solution-box" />
    <text x="675" y="90" class="header" style="fill: #065f46;">✅ AFTER: Integrated Platform</text>

    <!-- AI-Powered Platform Hub -->
    <rect x="580" y="150" width="190" height="120" rx="10" class="integrated-box" stroke-width="3" />
    <text x="675" y="175" class="emoji">🤖</text>
    <text x="675" y="200" class="text" style="font-weight: 700; font-size: 14px; fill: #065f46;">AI-Powered Platform</text>
    <text x="675" y="220" class="subtitle">Unified Data Integration</text>
    <text x="675" y="235" class="subtitle">Real-time Analysis</text>
    <text x="675" y="250" class="subtitle">Personalized Insights</text>
    <text x="675" y="265" class="subtitle">Continuous Monitoring</text>

    <!-- Data sources flowing INTO platform -->
    <g>
      <!-- Left sources -->
      <circle cx="520" cy="180" r="20" fill="#dcfce7" stroke="#10b981" stroke-width="1.5" />
      <text x="520" y="188" style="font-size: 18px; text-anchor: middle;">📊</text>
      <path d="M 540 180 L 580 190" class="flow-line" />

      <circle cx="520" cy="230" r="20" fill="#dcfce7" stroke="#10b981" stroke-width="1.5" />
      <text x="520" y="238" style="font-size: 18px; text-anchor: middle;">🍎</text>
      <path d="M 540 230 L 580 220" class="flow-line" />

      <!-- Right sources -->
      <circle cx="830" cy="180" r="20" fill="#dcfce7" stroke="#10b981" stroke-width="1.5" />
      <text x="830" y="188" style="font-size: 18px; text-anchor: middle;">🏃</text>
      <path d="M 810 180 L 770 190" class="flow-line" />

      <circle cx="830" cy="230" r="20" fill="#dcfce7" stroke="#10b981" stroke-width="1.5" />
      <text x="830" y="238" style="font-size: 18px; text-anchor: middle;">💊</text>
      <path d="M 810 230 L 770 220" class="flow-line" />
    </g>

    <!-- Outputs to Patient and Clinician -->
    <!-- Patient -->
    <g>
      <rect x="510" y="300" width="130" height="70" rx="8" class="solution-box" />
      <text x="575" y="325" class="emoji" style="font-size: 20px;">😊</text>
      <text x="575" y="345" class="text" style="font-weight: 600;">Empowered Patient</text>
      <text x="575" y="362" class="subtitle">Actionable insights</text>
      <path d="M 655 270 L 610 300" class="flow-line" />
    </g>

    <!-- Clinician -->
    <g>
      <rect x="710" y="300" width="130" height="70" rx="8" class="solution-box" />
      <text x="775" y="325" class="emoji" style="font-size: 20px;">👨‍⚕️</text>
      <text x="775" y="345" class="text" style="font-weight: 600;">Informed Clinician</text>
      <text x="775" y="362" class="subtitle">Priority alerts</text>
      <path d="M 695 270 L 740 300" class="flow-line" />
    </g>

    <!-- Benefits -->
    <g transform="translate(470, 390)">
      <rect x="0" y="0" width="410" height="130" rx="8" style="fill: #ecfdf5; stroke: #6ee7b7; stroke-width: 1.5;" />
      <text x="205" y="25" class="text" style="font-weight: 700; fill: #065f46;">Solution Benefits:</text>

      <text x="30" y="50" class="subtitle" style="text-anchor: start;">✨ Single unified platform for all health data</text>
      <text x="30" y="68" class="subtitle" style="text-anchor: start;">🎯 AI provides context-aware, personalized guidance</text>
      <text x="30" y="86" class="subtitle" style="text-anchor: start;">⚡ Proactive care - early warning detection</text>
      <text x="30" y="104" class="subtitle" style="text-anchor: start;">📈 Clinicians prioritize high-risk patients (attention funnel)</text>
      <text x="30" y="122" class="subtitle" style="text-anchor: start;">🚀 Scalable, automated - no human coaching needed</text>
    </g>
  </g>
</svg>